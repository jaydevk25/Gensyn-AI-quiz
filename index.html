<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gensyn AI Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'gensyn-black': '#0D0D0D',
            'gensyn-gray': '#1A1A1A',
            'gensyn-light-gray': '#B3B3B3',
            'gensyn-warm-pink': '#D9A689',
            'gensyn-beige': '#F5EFE6',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'slide-in': 'slideIn 0.5s ease-in-out forwards',
            'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideIn: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            pulseGlow: {
              '0%, 100%': { 
                opacity: '0.05',
                filter: 'drop-shadow(0 0 15px #D9A689)',
              },
              '50%': { 
                opacity: '0.1',
                filter: 'drop-shadow(0 0 30px #D9A689)',
              },
            }
          }
        }
      }
    }
  </script>
<script type="importmap">

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gensyn-black text-white font-sans">

</body>
</html>

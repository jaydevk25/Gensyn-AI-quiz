<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gensyn AI quiz</title>
  <style>
    /* =========================
       Gensyn-Inspired Brown / Light-Pink Theme
       ========================= */
    * { margin:0; padding:0; box-sizing:border-box }
    :root{
      /* Deep neutral-brown canvas with soft pink accents */
      --bg-1:#0F0C0A;         /* base background (deep brown/black) */
      --bg-2:#15100E;         /* glass/card layer (brown tint) */
      --accent:#F6C2D9;       /* light pink primary */
      --accent-2:#EE9FBC;     /* rose pink secondary */
      --text:#FFFFFF;         /* text */
      --glow:#FFD7E8;         /* gentle pink glow */
      --ok:#22C55E;           /* correct */
      --err:#EF4444;          /* incorrect */

      --radius-12:12px;
      --radius-16:16px;
      --radius-20:20px;

      --topbar-h:72px;
    }

    html,body{height:100%}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(246,194,217,0.06), transparent 40%),
        radial-gradient(1000px 600px at 80% 90%, rgba(238,159,188,0.05), transparent 45%),
        var(--bg-1);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow-x:hidden;
      padding-top: var(--topbar-h); /* keep content below fixed header */
    }

    /* =========================
       Fixed Top Bar (Logo + Title + Right Buttons)
       ========================= */
    .topbar{
      position:fixed; top:0; left:0; right:0; z-index:50;
      background: linear-gradient(180deg, rgba(21,16,14,0.85), rgba(21,16,14,0.55));
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(246,194,217,0.25);
    }
    .topbar-inner{
      max-width:1100px; margin:0 auto; padding:14px 20px;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:12px; min-width:0;
    }
    .brand-mark{
      width:34px; height:34px; flex:0 0 34px; object-fit:contain;
      filter: drop-shadow(0 0 12px rgba(255,215,232,0.25));
    }
    .brand-title{
      font-weight:900; letter-spacing:.2px;
      font-size:clamp(18px, 2.2vw, 22px);
      line-height:1;
      background: linear-gradient(135deg, #FFF 0%, var(--accent) 55%, var(--accent-2) 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow: 0 0 16px rgba(246,194,217,0.18);
      white-space:nowrap;
    }

    /* Header buttons (moved to top-right) */
    .header-actions{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .nav-btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:.6rem 0.9rem; border-radius:999px; text-decoration:none;
      font-weight:800; letter-spacing:.2px; color:#2A1518;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow:
        0 10px 26px rgba(246,194,217,0.18),
        0 0 0 1px rgba(246,194,217,0.55) inset;
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
      will-change: transform, filter, box-shadow;
    }
    .nav-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 14px 34px rgba(246,194,217,0.28), 0 0 0 1px rgba(255,215,232,0.55) inset;
    }

    /* Subtle vignette */
    .bg-vignette{
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background: radial-gradient(60% 50% at 50% 50%, transparent 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.55) 100%);
    }

    /* =========================
       Layout
       ========================= */
    .container{
      position:relative; z-index:1;
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2rem; max-width:900px; width:100%; margin:0 auto;
    }
    .view{ display:none; width:100%; text-align:center; animation:fadeIn .5s ease-in }
    .view.active{ display:block }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

    /* =========================
       Landing / Hero
       ========================= */
    #landing{ padding-bottom: 1rem }
    .hero-title{
      font-size:clamp(1.8rem,5vw,3.2rem);
      font-weight:900; letter-spacing:.3px; margin-bottom:1rem;
      text-shadow:0 0 18px rgba(246,194,217,0.16);
      background:linear-gradient(135deg, var(--text) 0%, #FFEFF6 35%, var(--accent) 70%, var(--accent

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gensyn AI Quiz</title>
  <style>
    /* =========================
       Gensyn Theme & Reset
       ========================= */
    * { margin:0; padding:0; box-sizing:border-box }
    :root{
      --bg-1:#1A1A2E;         /* base background */
      --bg-2:#16213E;         /* card background */
      --accent:#00D4FF;       /* primary accent */
      --accent-2:#0099CC;     /* secondary accent */
      --text:#FFFFFF;         /* text color */
      --glow:#00FFE0;         /* glow accent */
      --ok:#22C55E;           /* correct */
      --err:#EF4444;          /* incorrect */
    }
    html,body{height:100%}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(0,212,255,0.05), transparent 40%),
        radial-gradient(1000px 600px at 80% 90%, rgba(0,255,224,0.04), transparent 45%),
        var(--bg-1);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow-x:hidden;
    }

    /* =========================
       Background Logo Layers
       ========================= */
    .bg-logo{
      position:fixed; inset:0; z-index:0;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none; opacity:0.065;
      filter:saturate(0) brightness(1.15);
      animation:logoFloat 16s ease-in-out infinite alternate;
      will-change:transform, opacity, filter;
    }
    .bg-logo::before{
      content:"";
      width:min(45vmin,520px); height:min(45vmin,520px);
      background-image:url("https://cdn.prod.website-files.com/66bc6da8fe284e469308903c/67c05acd365d9e972e43e686_gensyn-dymbol-black%404x.jpg");
      background-repeat:no-repeat; background-position:center; background-size:contain;
      display:block; transform:translateZ(0);
    }
    .bg-vignette{
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background: radial-gradient(60% 50% at 50% 50%, transparent 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.55) 100%);
    }
    @media (prefers-reduced-motion: reduce){ .bg-logo{ animation:none } }
    @keyframes logoFloat{
      0%   { transform:translateY(-0.6vh) scale(1);   opacity:0.055; filter:saturate(0) brightness(1.12) }
      100% { transform:translateY(0.9vh)  scale(1.03); opacity:0.078; filter:saturate(0) brightness(1.18) }
    }

    /* =========================
       Layout
       ========================= */
    .container{
      position:relative; z-index:2;
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2rem; max-width:900px; width:100%; margin:0 auto;
    }
    .view{ display:none; width:100%; text-align:center; animation:fadeIn .5s ease-in }
    .view.active{ display:block }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

    /* =========================
       Landing / Hero
       ========================= */
    .logo{
      font-size:clamp(2rem,5vw,3.4rem);
      font-weight:900; letter-spacing:.3px; margin-bottom:1rem;
      text-shadow:0 0 18px rgba(0,212,255,0.15);
      background:linear-gradient(135deg, var(--text) 0%, #DFFBFF 35%, var(--accent) 85%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    }
    .description{
      font-size:clamp(1rem,2.1vw,1.15rem);
      color:rgba(255,255,255,0.82);
      margin:0 auto 1.6rem; line-height:1.6; max-width:760px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      background:linear-gradient(180deg, rgba(0,212,255,0.13), rgba(0,212,255,0.06));
      border:1px solid rgba(0,212,255,0.28);
      box-shadow:0 0 24px rgba(0,255,224,0.07) inset;
      border-radius:12px; padding:.75rem 1.25rem; margin-bottom:1.8rem;
      font-size:1rem; font-weight:700; color:#E9FCFF;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent) 0%, #61E9FF 100%);
      color:#00121A; border:none; border-radius:12px;
      padding:1rem 1.4rem; font-size:1.05rem; font-weight:800; cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      box-shadow:0 10px 26px rgba(0,212,255,0.18), 0 0 0 1px rgba(0,212,255,0.45) inset;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.04);
      box-shadow:0 14px 34px rgba(0,212,255,0.26), 0 0 0 1px rgba(0,255,224,0.5) inset }
    .btn:active{ transform:translateY(0) scale(.99) }

    /* =========================
       Quiz UI
       ========================= */
    .progress{
      background:rgba(255,255,255,0.08); outline:1px solid rgba(0,212,255,0.18);
      border-radius:20px; height:8px; width:100%; margin-bottom:1.5rem; overflow:hidden;
    }
    .progress-bar{
      background:linear-gradient(90deg, var(--accent), #61E9FF);
      height:100%; border-radius:20px; transition:width .45s ease;
      box-shadow:0 0 12px rgba(0,212,255,0.35);
    }
    .question-info{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:1.2rem; font-size:.95rem; color:rgba(255,255,255,0.78);
    }
    .card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(0,212,255,0.22);
      border-radius:16px; padding:1.5rem; margin-bottom:1.5rem;
      backdrop-filter:blur(10px); box-shadow:0 8px 26px rgba(0,0,0,0.25);
      text-align:left;
    }
    .question-text{ font-size:1.25rem; font-weight:700; margin-bottom:1.2rem; line-height:1.5 }
    .options{ display:grid; gap:.9rem }
    .option{
      background:rgba(255,255,255,0.06);
      border:2px solid rgba(255,255,255,0.18);
      border-radius:12px; padding:1rem 1.2rem; cursor:pointer; color:var(--text);
      transition:border-color .2s ease, background .2s ease, transform .12s ease;
    }
    .option:hover{ border-color:var(--accent); background:rgba(0,212,255,0.10) }
    .option.correct{ border-color:var(--ok); background:rgba(34,197,94,0.18) }
    .option.incorrect{ border-color:var(--err); background:rgba(239,68,68,0.18) }

    .next-btn{

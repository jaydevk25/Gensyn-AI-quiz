<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gensyn AI Quiz</title>
  <style>
    /* =========================
       Gensyn Theme & Reset
       ========================= */
    * { margin:0; padding:0; box-sizing:border-box }
    :root{
      --bg-1:#1A1A2E;         /* base background */
      --bg-2:#16213E;         /* card background */
      --accent:#00D4FF;       /* primary accent */
      --accent-2:#0099CC;     /* secondary accent */
      --text:#FFFFFF;         /* text color */
      --glow:#00FFE0;         /* glow accent */
      --ok:#22C55E;           /* correct */
      --err:#EF4444;          /* incorrect */
    }
    html,body{height:100%}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(0,212,255,0.05), transparent 40%),
        radial-gradient(1000px 600px at 80% 90%, rgba(0,255,224,0.04), transparent 45%),
        var(--bg-1);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow-x:hidden;
    }

    /* =========================
       Background Logo Layers
       ========================= */
    .bg-logo{
      position:fixed; inset:0; z-index:0;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none; opacity:0.065;
      filter:saturate(0) brightness(1.15);
      animation:logoFloat 16s ease-in-out infinite alternate;
      will-change:transform, opacity, filter;
    }
    .bg-logo::before{
      content:"";
      width:min(45vmin,520px); height:min(45vmin,520px);
      background-image:url("https://cdn.prod.website-files.com/66bc6da8fe284e469308903c/67c05acd365d9e972e43e686_gensyn-dymbol-black%404x.jpg");
      background-repeat:no-repeat; background-position:center; background-size:contain;
      display:block; transform:translateZ(0);
    }
    .bg-vignette{
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background: radial-gradient(60% 50% at 50% 50%, transparent 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.55) 100%);
    }
    @media (prefers-reduced-motion: reduce){ .bg-logo{ animation:none } }
    @keyframes logoFloat{
      0%   { transform:translateY(-0.6vh) scale(1);   opacity:0.055; filter:saturate(0) brightness(1.12) }
      100% { transform:translateY(0.9vh)  scale(1.03); opacity:0.078; filter:saturate(0) brightness(1.18) }
    }

    /* =========================
       Layout
       ========================= */
    .container{
      position:relative; z-index:2;
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2rem; max-width:900px; width:100%; margin:0 auto;
    }
    .view{ display:none; width:100%; text-align:center; animation:fadeIn .5s ease-in }
    .view.active{ display:block }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }

    /* =========================
       Landing / Hero
       ========================= */
    .logo{
      font-size:clamp(2rem,5vw,3.4rem);
      font-weight:900; letter-spacing:.3px; margin-bottom:1rem;
      text-shadow:0 0 18px rgba(0,212,255,0.15);
      background:linear-gradient(135deg, var(--text) 0%, #DFFBFF 35%, var(--accent) 85%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    }
    .description{
      font-size:clamp(1rem,2.1vw,1.15rem);
      color:rgba(255,255,255,0.82);
      margin:0 auto 1.6rem; line-height:1.6; max-width:760px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      background:linear-gradient(180deg, rgba(0,212,255,0.13), rgba(0,212,255,0.06));
      border:1px solid rgba(0,212,255,0.28);
      box-shadow:0 0 24px rgba(0,255,224,0.07) inset;
      border-radius:12px; padding:.75rem 1.25rem; margin-bottom:1.8rem;
      font-size:1rem; font-weight:700; color:#E9FCFF;
    }
    .btn{
      background:linear-gradient(135deg, var(--accent) 0%, #61E9FF 100%);
      color:#00121A; border:none; border-radius:12px;
      padding:1rem 1.4rem; font-size:1.05rem; font-weight:800; cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
      box-shadow:0 10px 26px rgba(0,212,255,0.18), 0 0 0 1px rgba(0,212,255,0.45) inset;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.04);
      box-shadow:0 14px 34px rgba(0,212,255,0.26), 0 0 0 1px rgba(0,255,224,0.5) inset }
    .btn:active{ transform:translateY(0) scale(.99) }

    /* =========================
       Quiz UI
       ========================= */
    .progress{
      background:rgba(255,255,255,0.08); outline:1px solid rgba(0,212,255,0.18);
      border-radius:20px; height:8px; width:100%; margin-bottom:1.5rem; overflow:hidden;
    }
    .progress-bar{
      background:linear-gradient(90deg, var(--accent), #61E9FF);
      height:100%; border-radius:20px; transition:width .45s ease;
      box-shadow:0 0 12px rgba(0,212,255,0.35);
    }
    .question-info{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:1.2rem; font-size:.95rem; color:rgba(255,255,255,0.78);
    }
    .card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(0,212,255,0.22);
      border-radius:16px; padding:1.5rem; margin-bottom:1.5rem;
      backdrop-filter:blur(10px); box-shadow:0 8px 26px rgba(0,0,0,0.25);
      text-align:left;
    }
    .question-text{ font-size:1.25rem; font-weight:700; margin-bottom:1.2rem; line-height:1.5 }
    .options{ display:grid; gap:.9rem }
    .option{
      background:rgba(255,255,255,0.06);
      border:2px solid rgba(255,255,255,0.18);
      border-radius:12px; padding:1rem 1.2rem; cursor:pointer; color:var(--text);
      transition:border-color .2s ease, background .2s ease, transform .12s ease;
    }
    .option:hover{ border-color:var(--accent); background:rgba(0,212,255,0.10) }
    .option.correct{ border-color:var(--ok); background:rgba(34,197,94,0.18) }
    .option.incorrect{ border-color:var(--err); background:rgba(239,68,68,0.18) }

    /* Next button hidden because auto-advance is enabled; keep for A11Y fallback */
    .next-btn{ display:none }

    /* =========================
       Results
       ========================= */
    .score-card{
      background:rgba(255,255,255,0.04);
      border:2px solid rgba(0,212,255,0.28);
      border-radius:20px; padding:2.25rem 1.75rem; text-align:center;
      backdrop-filter:blur(10px); box-shadow:0 10px 28px rgba(0,0,0,0.28);
    }
    .score-title{
      font-size:1.9rem; margin-bottom:.6rem; font-weight:900;
      background:linear-gradient(135deg, var(--text) 0%, #DFFBFF 35%, var(--accent) 85%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 0 18px rgba(0,212,255,0.15);
    }
    .score-display{ font-size:3rem; font-weight:900; color:var(--text); margin-bottom:.5rem }
    .score-message{ font-size:1.05rem; color:rgba(255,255,255,0.82); margin-bottom:1.25rem }

    .footer{
      position:relative; z-index:2; text-align:center; padding:1.5rem;
      border-top:1px solid rgba(255,255,255,0.08);
    }
    .footer a{
      color:var(--accent); text-decoration:none; font-size:.95rem; font-weight:600;
      transition:color .18s ease, text-shadow .18s ease;
      text-shadow:0 0 12px rgba(0,212,255,0.18);
    }
    .footer a:hover{ color:#DFFBFF; text-shadow:0 0 16px rgba(0,212,255,0.32) }

    @media (max-width: 768px) {
      .container { padding: 1rem }
      .card { padding: 1.25rem }
      .question-text { font-size: 1.1rem }
      .score-display { font-size: 2.4rem }
    }
  </style>
</head>
<body>
  <!-- Non-interactive background layers -->
  <div class="bg-logo" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div class="container">
    <!-- Landing Page -->
    <div id="landing" class="view active">
      <h1 class="logo">Gensyn AI Quiz</h1>
      <p class="description">
        Welcome to Gensyn AI quiz mania.
        10 quick questions to test your knowledge on machine intelligence. Let's get started.
      </p>
      <div class="pill">Total Questions: 10</div>
      <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Quiz Page -->
    <div id="quiz" class="view">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="question-info">
        <span id="questionNumber">Question 1 of 10</span>
        <span>Score: <span id="currentScore">0</span></span>
      </div>
      <div class="card">
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
      </div>
    </div>

    <!-- Results Page -->
    <div id="results" class="view">
      <div class="score-card">
        <h2 class="score-title">Quiz Complete!</h2>
        <div class="score-display" id="finalScore">0/10</div>
        <p class="score-message" id="scoreMessage">Great job completing the quiz!</p>
        <button class="btn" onclick="restartQuiz()">Take Quiz Again</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <a href="https://x.com/kaizoku_ap" target="_blank" rel="noopener">made with ❤️ by kaizoku</a>
  </footer>

  <script>
    // Quiz data (your existing bank; 10 will be chosen at random each run)

      },
      {
        question: "What is BlockAssist?",
        options: ["A blockchain explorer", "An AI Minecraft assistant for reinforcement learning research", "A block validation tool", "A cryptocurrency wallet"],
        correct: 1
      },
      {

      },

        correct: 1
      },
      {
        question: "What is NoLoCo?",

        correct: 1
      },
      {

      {

        correct: 2
      },
      {

        options: ["It's faster than traditional methods", "It uses probabilistic proof-of-learning and graph-based protocols", "It requires less energy", "It works offline"],
        correct: 1
      },

        options: ["Social network", "Payment network", "Network for machine intelligence", "Content delivery network"],

      {

      {

      },
      {
        question: "What are the three phases of Gensyn's development roadmap?",
        options: ["Alpha, Beta, Production", "Development, Testing, Launch", "Testnet, Canarynet, Mainnet", "Research, Implementation, Deployment"],

      },

      {
        question: "How much monthly savings on API costs has Gensyn achieved through optimization?",
        options: ["$5,000", "$10,000", "$15,000", "$20,000"],

      {
        question: "What is Gensyn's primary brand color?",

        question: "What RGB value represents Gensyn's Primary Pink color?",

        options: ["100,000%", "500,000%", "1,000,000%", "2,522,477%"],

      {

        options: ["~30%", "~46%", "~60%", "~75%"],

      },
      {
        question: "Which blockchain network will Gensyn's canarynet launch on?",
        options: ["Ethereum", "Polkadot", "Kusama", "Binance Smart Chain"],
        correct: 2
      },
      {
        question: "Which blockchain network will host Gensyn's mainnet?",
        options: ["Ethereum", "Polkadot", "Kusama", "Solana"],
        correct: 1
      },
      {
        question: "What is the total funding Gensyn has raised to date (as mentioned in the research)?",
        options: ["Over $30 million", "Over $43 million", "Over $50 million", "Over $75 million"],
        correct: 2
      },
      {
        question: "Which prominent investor led Gensyn's Series A funding round?",
        options: ["Sequoia Capital", "a16z (Andreessen Horowitz)", "Binance Labs", "Coinbase Ventures"],
        correct: 1
      },
      {
        question: "What year was Gensyn's Series A funding completed?",
        options: ["2022", "2023", "2024", "2025"],
        correct: 1
      },
      {
        question: "What is the primary focus of Gensyn's long-term vision?",
        options: ["Replacing all cloud providers", "Creating AGI through decentralized, collectively-owned foundation models", "Building the fastest blockchain", "Dominating the AI chip market"],
        correct: 1
      },
      {
        question: "According to research, what percentage of US GDP could AI training spending reach by 2031?",
        options: ["0.5%", "1%", "2%", "3%"],
        correct: 1
      },
      {
        question: "What does 'RepOps' stand for in Gensyn's Verde system?",
        options: ["Reproducible Operations", "Reliable Operations", "Remote Operations", "Responsive Operations"],
        correct: 0
      },
      {
        question: "What distinguishes Gensyn's approach from traditional centralized AI training?",
        options: ["Faster processing speed", "Better accuracy", "Open, permissionless, and neutral protocols", "Lower memory requirements"],
        correct: 2
      },
      {
        question: "What role does game theory play in Gensyn's protocol?",
        options: ["Entertainment purposes", "User engagement", "Ensuring honest behavior through staking and slashing incentives", "Random number generation"],
        correct: 2
      },
      {
        question: "What does Gensyn's graph-based pinpoint protocol enable?",
        options: ["Faster data transfer", "Multi-granular verification work comparison and chain confirmation", "Better user interfaces", "Reduced energy consumption"],
        correct: 1
      }
    ];

    // Game state
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedQuestions = [];
    let answered = false;

    // Shuffle helper
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // View switch
    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Start quiz
    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      answered = false;
      selectedQuestions = shuffleArray(quizQuestions).slice(0, 10);
      showView('quiz');
      displayQuestion();
    }

    // Render current question
    function displayQuestion() {
      const q = selectedQuestions[currentQuestionIndex];
      const n = currentQuestionIndex + 1;

      document.getElementById('questionNumber').textContent = `Question ${n} of 10`;
      document.getElementById('currentScore').textContent = score;
      document.getElementById('questionText').textContent = q.question;
      document.getElementById('progressBar').style.width = `${(n / 10) * 100}%`;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, i) => {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
        el.onclick = () => selectOption(i, el);
        container.appendChild(el);
      });

      answered = false;
    }

    // Handle selection (auto-advance after short delay)
    function selectOption(index, el) {
      if (answered) return;
      answered = true;

      const q = selectedQuestions[currentQuestionIndex];
      const options = [...document.querySelectorAll('.option')];

      // Disable further clicks
      options.forEach(o => o.style.pointerEvents = 'none');

      // Reveal correct and mark incorrect if needed
      options[q.correct].classList.add('correct');
      if (index !== q.correct) {
        el.classList.add('incorrect');
      } else {
        score++;
        document.getElementById('currentScore').textContent = score;
      }

      // Auto-advance after 950ms
      setTimeout(() => {
        if (currentQuestionIndex < 9) {
          currentQuestionIndex++;
          displayQuestion();
        } else {
          showResults();
        }
      }, 950);
    }

    // Results
    function showResults() {
      document.getElementById('finalScore').textContent = `${score}/10`;
      let msg = '';
      if (score >= 9) msg = 'Outstanding! You have excellent knowledge of Gensyn AI!';
      else if (score >= 7) msg = 'Great job! You have a solid understanding of Gensyn AI!';
      else if (score >= 5) msg = 'Good effort! Explore more about Gensyn AI to level up!';
      else msg = 'Keep going—there’s a lot more to discover about Gensyn AI!';
      document.getElementById('scoreMessage').textContent = msg;
      showView('results');
    }

    // Restart
    function restartQuiz() { showView('landing') }
  </script>
</body>
</html>
